<aside class="sidebar">
  <div class="sidebar__logo" role="img" aria-label="Huddle DMZ Portal"></div>
  <div class="sidebar__igloo" role="presentation"></div>
  <div class="sidebar__pledge">
    <h3>TOGETHER,<span class="accent">WE STAY SECURE.</span></h3>
    <p>Huddle keeps your dev environments protected from the cold outside. <span class="heart">&hearts;</span></p>
  </div>

  <nav class="nav">
    <a class="nav__item" routerLink="dashboard" routerLinkActive="nav__item--active">
      <app-icon name="home" [size]="20" />
      <span>Dashboard</span>
    </a>
    <a class="nav__item" routerLink="containers" routerLinkActive="nav__item--active">
      <app-icon name="box" [size]="20" />
      <span>Containers</span>
    </a>
    <a class="nav__item" routerLink="firewall" routerLinkActive="nav__item--active">
      <app-icon name="globe" [size]="20" />
      <span>Firewall</span>
    </a>
    <a class="nav__item" routerLink="docker-access" routerLinkActive="nav__item--active">
      <app-icon name="anchor" [size]="20" />
      <span>Docker Access</span>
    </a>
    <a class="nav__item" routerLink="policies" routerLinkActive="nav__item--active">
      <app-icon name="shield-check" [size]="20" />
      <span>Policies</span>
    </a>
    <a class="nav__item" routerLink="audit" routerLinkActive="nav__item--active">
      <app-icon name="file-text" [size]="20" />
      <span>Audit Logs</span>
    </a>
    <a class="nav__item" routerLink="settings" routerLinkActive="nav__item--active">
      <app-icon name="settings" [size]="20" />
      <span>Settings</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <div class="badge">
      <app-icon name="shield-check" [size]="20" />
    </div>
    <div class="meta">
      <b>Huddle DMZ Portal</b>
      <span>v1.0.42</span>
    </div>
  </div>
</aside>
