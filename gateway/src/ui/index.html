<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huddle — DMZ Portal</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div id="sidebar-logo" class="sidebar-logo sprite sprite-huddle-logo-icon" role="img" aria-label="Huddle"></div>
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-name">HUDDLE</span>
        <span class="sidebar-brand-sub">DMZ PORTAL</span>
      </div>
    </div>

    <div class="sidebar-hero">
      <div class="sidebar-hero-img sprite sprite-sidebar-penguin-illustration" role="presentation"></div>
      <div class="sidebar-hero-text">
        <span class="sidebar-hero-title">TOGETHER,<br><em>WE STAY SECURE.</em></span>
        <p class="sidebar-hero-sub">Huddle keeps your dev environments protected from the cold outside.</p>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <a class="sidebar-link" data-route="dashboard" href="#dashboard">
        <span class="sidebar-icon">&#9632;</span><span>Dashboard</span>
      </a>
      <a class="sidebar-link" data-route="containers" href="#containers">
        <span class="sidebar-icon">&#9635;</span><span>Containers</span>
      </a>
      <a class="sidebar-link" data-route="firewall" href="#firewall">
        <span class="sidebar-icon">&#9633;</span><span>Firewall</span>
      </a>
      <a class="sidebar-link" data-route="docker-access" href="#docker-access">
        <span class="sidebar-icon">&#9634;</span><span>Docker Access</span>
      </a>
      <a class="sidebar-link" data-route="policies" href="#policies">
        <span class="sidebar-icon">&#9671;</span><span>Policies</span>
      </a>
      <a class="sidebar-link" data-route="audit" href="#audit">
        <span class="sidebar-icon">&#9776;</span><span>Audit Logs</span>
      </a>
      <a class="sidebar-link" data-route="settings" href="#settings">
        <span class="sidebar-icon">&#9881;</span><span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="sidebar-version">Huddle DMZ Portal v2.3.0</span>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <span id="page-breadcrumb" class="topbar-breadcrumb">Dashboard</span>
      </div>
      <div class="topbar-right">
        <button id="btn-theme" class="btn-icon-square" type="button" title="Wissel thema">🌙</button>
        <button id="btn-start" class="btn btn-primary" type="button">+ Start devcontainer</button>
        <div class="user-avatar" title="Gebruiker">U</div>
      </div>
    </header>

    <main id="page-content"></main>
  </div>
</div>


<!-- ── Snapshot modal ────────────────────────────────────────────────────── -->
<div id="modal-snapshot" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Snapshot maken</h2>
      <button class="modal-close" data-close="modal-snapshot">✕</button>
    </div>
    <div class="modal-body">
      <label for="snapshot-name">Image naam</label>
      <input id="snapshot-name" type="text" placeholder="snapshot-containernaam" />
      <p id="snapshot-error" class="form-error hidden"></p>
    </div>
    <div class="modal-footer">
      <button id="btn-snapshot-confirm" class="btn btn-primary" type="button">Maken</button>
      <button class="btn btn-ghost" data-close="modal-snapshot" type="button">Annuleren</button>
    </div>
  </div>
</div>

<!-- ── Start devcontainer modal ──────────────────────────────────────────── -->
<div id="modal-start" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Start devcontainer</h2>
      <button class="modal-close" data-close="modal-start">✕</button>
    </div>
    <div class="modal-body">
      <label for="start-image">Image</label>
      <select id="start-image"></select>

      <label for="start-ide">IDE</label>
      <select id="start-ide">
        <option value="intellij">IntelliJ IDEA</option>
        <option value="rider">Rider</option>
      </select>

      <label for="start-workspace">Workspace directory</label>
      <input id="start-workspace" type="text" placeholder="C:/projects/mijn-project" />

      <label for="start-name">Containernaam</label>
      <input id="start-name" type="text" placeholder="devcontainer-mijn-project" />

      <p id="start-error" class="form-error hidden"></p>
      <p id="start-status" class="form-status hidden"></p>
    </div>
    <div class="modal-footer">
      <button id="btn-start-confirm" class="btn btn-primary" type="button">Starten</button>
      <button class="btn btn-ghost" data-close="modal-start" type="button">Annuleren</button>
    </div>
  </div>
</div>

<!-- ── Global confirm modal ──────────────────────────────────────────────── -->
<div id="modal-confirm" class="modal hidden">
  <div class="modal-box modal-box--narrow">
    <div class="modal-header">
      <h2>Globaal toestaan</h2>
      <button class="modal-close" data-close="modal-confirm">✕</button>
    </div>
    <div class="modal-body">
      <p id="confirm-msg"></p>
    </div>
    <div class="modal-footer">
      <button id="btn-confirm-ok" class="btn btn-primary" type="button">Toestaan</button>
      <button class="btn btn-ghost" data-close="modal-confirm" type="button">Annuleren</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
