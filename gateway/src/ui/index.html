<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huddle — DMZ Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="app">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar__logo" role="img" aria-label="Huddle DMZ Portal"></div>

    <div class="sidebar__igloo" role="presentation"></div>

    <div class="sidebar__pledge">
      <h3>TOGETHER,<span class="accent">WE STAY SECURE.</span></h3>
      <p>Huddle keeps your dev environments protected from the cold outside. <span class="heart">♥</span></p>
    </div>

    <nav class="nav" id="sidebar-nav">
      <a class="nav__item" data-route="dashboard" href="#dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav__item" data-route="containers" href="#containers">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        <span>Containers</span>
      </a>
      <a class="nav__item" data-route="firewall" href="#firewall">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg>
        <span>Firewall</span>
      </a>
      <a class="nav__item" data-route="docker-access" href="#docker-access">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.4 18 22 11h-1l-9-3-9 3H2l2.6 7"/><path d="M12 8V2H8"/><path d="M5 11v-1a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1"/></svg>
        <span>Docker Access</span>
      </a>
      <a class="nav__item" data-route="policies" href="#policies">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Policies</span>
      </a>
      <a class="nav__item" data-route="audit" href="#audit">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M8 9h2"/></svg>
        <span>Audit Logs</span>
      </a>
      <a class="nav__item" data-route="settings" href="#settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <div class="badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div class="meta">
        <b>Huddle DMZ Portal</b>
        <span>v2.3.0</span>
      </div>
      <div class="online-dot" title="Connected"></div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    <header class="topbar">
      <span id="page-breadcrumb" class="topbar__title">Dashboard</span>
      <div class="topbar__spacer"></div>

      <button id="btn-theme" class="icon-btn" type="button" title="Toggle theme">🌙</button>

      <button id="btn-start" class="icon-btn" type="button" title="Start devcontainer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>

      <button class="icon-btn" type="button" title="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>

      <div class="profile">
        <div class="profile__avatar">A</div>
        <div class="profile__name">
          <b>Admin</b>
          <span>DMZ Portal</span>
        </div>
      </div>
    </header>

    <div class="content" id="page-content"></div>
  </div>
</div>


<!-- ── Snapshot modal ── -->
<div id="modal-snapshot" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Snapshot maken</h2>
      <button class="modal-close" data-close="modal-snapshot">✕</button>
    </div>
    <div class="modal-body">
      <label for="snapshot-name">Image naam</label>
      <input id="snapshot-name" type="text" placeholder="snapshot-containernaam" />
      <p id="snapshot-error" class="form-error hidden"></p>
    </div>
    <div class="modal-footer">
      <button id="btn-snapshot-confirm" class="btn btn-primary" type="button">Maken</button>
      <button class="btn btn-ghost" data-close="modal-snapshot" type="button">Annuleren</button>
    </div>
  </div>
</div>

<!-- ── Start devcontainer modal ── -->
<div id="modal-start" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Start devcontainer</h2>
      <button class="modal-close" data-close="modal-start">✕</button>
    </div>
    <div class="modal-body">
      <label for="start-image">Image</label>
      <select id="start-image"></select>

      <label for="start-ide">IDE</label>
      <select id="start-ide">
        <option value="intellij">IntelliJ IDEA</option>
        <option value="rider">Rider</option>
      </select>

      <label for="start-workspace">Workspace directory</label>
      <input id="start-workspace" type="text" placeholder="C:/projects/mijn-project" />

      <label for="start-name">Containernaam</label>
      <input id="start-name" type="text" placeholder="devcontainer-mijn-project" />

      <p id="start-error" class="form-error hidden"></p>
      <p id="start-status" class="form-status hidden"></p>
    </div>
    <div class="modal-footer">
      <button id="btn-start-confirm" class="btn btn-primary" type="button">Starten</button>
      <button class="btn btn-ghost" data-close="modal-start" type="button">Annuleren</button>
    </div>
  </div>
</div>

<!-- ── Global confirm modal ── -->
<div id="modal-confirm" class="modal hidden">
  <div class="modal-box modal-box--narrow">
    <div class="modal-header">
      <h2>Globaal toestaan</h2>
      <button class="modal-close" data-close="modal-confirm">✕</button>
    </div>
    <div class="modal-body">
      <p id="confirm-msg"></p>
    </div>
    <div class="modal-footer">
      <button id="btn-confirm-ok" class="btn btn-primary" type="button">Toestaan</button>
      <button class="btn btn-ghost" data-close="modal-confirm" type="button">Annuleren</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
