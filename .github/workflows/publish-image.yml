name: Publish

on:
  push:
    branches: [main, release/*]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/huddle:latest

  base-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base-devimage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base-devimage/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/base-devimage:latest

      - name: Build and push base-devimage-vscode
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base-devimage-vscode/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/base-devimage-vscode:latest

      - name: Build and push base-devimage-intellij
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base-devimage-intellij/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/base-devimage-intellij:latest

      - name: Build and push base-devimage-rider
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base-devimage-rider/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/infosupport/base-devimage-rider:latest

  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # GitVersion heeft de volledige historie én tags (het anker) nodig.
          fetch-depth: 0
          fetch-tags: true

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@51d325634925d7d9ce0a7efc2c586c0bc2b9eee6 # v3.2.1
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@51d325634925d7d9ce0a7efc2c586c0bc2b9eee6 # v3.2.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Set package version
        # patch = tag-patch + aantal commits sinds de tag -> uniek en oplopend
        # per commit, onafhankelijk van de GitVersion-modus.
        run: |
          cd cli
          PATCH=$(( ${{ steps.gitversion.outputs.patch }} + ${{ steps.gitversion.outputs.commitsSinceVersionSource }} ))
          VERSION="${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}.${PATCH}"
          echo "Berekende versie: $VERSION (patch ${{ steps.gitversion.outputs.patch }} + ${{ steps.gitversion.outputs.commitsSinceVersionSource }} commits)"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install & build
        run: cd cli && npm install && npm run build

      - name: Publish
        run: cd cli && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
