name: Test agent
# AI test agent (Huddle PDF part 2): attacks a throwaway Huddle built from the PR.
# Private findings are encrypted before leaving the agent job.
# Secrets: ANTHROPIC_API_KEY, SECURITY_REPORT_AGE_IDENTITY,
# SECURITY_REPORT_APP_PRIVATE_KEY. Variables: SECURITY_REPORT_AGE_RECIPIENT,
# SECURITY_REPORT_APP_CLIENT_ID.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-agent:
    runs-on: ubuntu-latest
    continue-on-error: true   # report-only for the first two weeks
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      has_output: ${{ steps.output.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Huddle and the target devcontainer
        run: |
          export HUDDLE_OPERATOR_TOKEN=$(openssl rand -hex 32); echo "::add-mask::$HUDDLE_OPERATOR_TOKEN"
          docker build -q -t huddle:pr gateway
          docker pull -q ghcr.io/infosupport/base-devimage-vscode
          npm ci --prefix cli && npm run build --prefix cli
          HUDDLE_IMAGE=huddle:pr HUDDLE_NO_PULL=1 node cli/dist/index.js init
          until node cli/dist/index.js start --ide vscode --empty --name target-dc; do sleep 3; done
          echo "{\"cookies\":[{\"name\":\"huddle_session\",\"value\":\"$HUDDLE_OPERATOR_TOKEN\",\"domain\":\"localhost\",\"path\":\"/\",\"expires\":-1,\"httpOnly\":true,\"secure\":false,\"sameSite\":\"Strict\"}],\"origins\":[]}" > huddle-session.json
          MCP=$(jq -r '.mcpServers.playwright.args[1]' .github/agent/playwright-mcp.json)
          npx -y "playwright@$(npm view "$MCP" dependencies.playwright)" install --with-deps chromium

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Follow the instructions in .github/agent/test-agent.md. The REPO_DIR placeholder in it means your working directory.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 120
            --mcp-config .github/agent/playwright-mcp.json
            --allowedTools "mcp__playwright__*,Bash(docker exec target-dc:*),Bash(docker exec -u root target-dc:*),Read,Write"
            --disallowedTools "Read(//proc/**)"

      - name: Check for agent output
        id: output
        if: always()
        run: |
          if [ -f findings.md ] || [ -f report.md ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Encrypt agent output for the reporting job
        if: always() && steps.output.outputs.present == 'true'
        env:
          AGE_RECIPIENT: ${{ vars.SECURITY_REPORT_AGE_RECIPIENT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          files=()
          [ ! -f findings.md ] || files+=(findings.md)
          [ ! -f report.md ] || files+=(report.md)
          tar -czf agent-output.tar.gz -- "${files[@]}"
          age -r "$AGE_RECIPIENT" -o agent-output.tar.gz.age agent-output.tar.gz
          rm -f findings.md report.md agent-output.tar.gz

      - name: Upload encrypted output
        if: always() && steps.output.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-agent-output
          path: agent-output.tar.gz.age
          if-no-files-found: error
          retention-days: 1

  report:
    needs: test-agent
    if: always() && needs.test-agent.outputs.has_output == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download encrypted output
        uses: actions/download-artifact@v4
        with:
          name: encrypted-agent-output

      - name: Decrypt agent output
        env:
          AGE_IDENTITY: ${{ secrets.SECURITY_REPORT_AGE_IDENTITY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          printf '%s\n' "$AGE_IDENTITY" > age-identity.txt
          age -d -i age-identity.txt -o agent-output.tar.gz agent-output.tar.gz.age
          tar -xzf agent-output.tar.gz
          rm -f age-identity.txt agent-output.tar.gz agent-output.tar.gz.age

      - name: Create short-lived GitHub App token
        if: hashFiles('findings.md') != ''
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # V3.4.0
        with:
          client-id: ${{ vars.SECURITY_REPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_REPORT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: huddle

      - name: Report findings privately
        if: hashFiles('findings.md') != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          jq -n --rawfile d findings.md \
            --arg s "Test agent finding, run ${{ github.run_id }}" \
            '{summary: $s, description: $d}' \
            | gh api --method POST \
                "repos/${{ github.repository }}/security-advisories/reports" \
                --input -
          rm -f findings.md

      - name: Post the public report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          grep -xE '(Firewall|HTTPS interception|Bypass attempts|Docker socket|Sudo|Portal): (PASS|UNCLEAR|security check failed, details sent to maintainers)|Portal: FAIL - [A-Za-z0-9 .,()-]{1,100}' \
            report.md > public.md || echo "The test agent wrote no valid report." > public.md
          cat public.md | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = pull_request ]; then
            gh pr comment "$PR_NUMBER" --body-file public.md
          fi
          [ "$(wc -l < public.md)" = 6 ] && ! grep -qE 'failed|FAIL' public.md