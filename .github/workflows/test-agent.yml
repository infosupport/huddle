name: Test agent
# AI test agent (Huddle PDF part 2): attacks a throwaway Huddle built from the PR.
# Public output is only the pass/fail line per area. Findings are encrypted before they
# leave the agent's runner, and filed as a private vulnerability report by a separate job.
# Secrets: ANTHROPIC_API_KEY (a dedicated, spend-limited key). In the "security-report"
# environment, with required reviewers: SECURITY_REPORT_AGE_IDENTITY, SECURITY_REPORT_APP_PRIVATE_KEY.
# Variables: SECURITY_REPORT_AGE_RECIPIENT, SECURITY_REPORT_APP_CLIENT_ID.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # The only report lines that may be made public.
  REPORT_LINES: '(Firewall|HTTPS interception|Bypass attempts|Docker socket|Sudo|Portal): (PASS|UNCLEAR|security check failed, details sent to maintainers)|Portal: FAIL - [A-Za-z0-9 .,()-]{1,100}'

jobs:
  test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      report: ${{ steps.result.outputs.report }}
      findings: ${{ steps.result.outputs.findings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Huddle and the target devcontainer
        run: |
          export HUDDLE_OPERATOR_TOKEN=$(openssl rand -hex 32); echo "::add-mask::$HUDDLE_OPERATOR_TOKEN"
          docker build -q -t huddle:pr gateway
          docker pull -q ghcr.io/infosupport/base-devimage-vscode
          npm ci --prefix cli && npm run build --prefix cli
          HUDDLE_IMAGE=huddle:pr HUDDLE_NO_PULL=1 node cli/dist/index.js init
          until node cli/dist/index.js start --ide vscode --empty --name target-dc; do sleep 3; done
          echo "{\"cookies\":[{\"name\":\"huddle_session\",\"value\":\"$HUDDLE_OPERATOR_TOKEN\",\"domain\":\"localhost\",\"path\":\"/\",\"expires\":-1,\"httpOnly\":true,\"secure\":false,\"sameSite\":\"Strict\"}],\"origins\":[]}" > huddle-session.json
          MCP=$(jq -r '.mcpServers.playwright.args[1]' .github/agent/playwright-mcp.json)
          npx -y "playwright@$(npm view "$MCP" dependencies.playwright)" install --with-deps chromium

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: Follow the instructions in .github/agent/test-agent.md. The REPO_DIR placeholder in it means your working directory.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 120
            --mcp-config .github/agent/playwright-mcp.json
            --allowedTools "mcp__playwright__*,Bash(docker exec target-dc:*),Bash(docker exec -u root target-dc:*),Read(./**),Edit(./evidence.md),Edit(./report.md),Edit(./findings.md)"
            --disallowedTools "Read(//proc/**)"

      # report.md is agent output: keep only lines in the exact allowed format. Findings are
      # encrypted, because artifacts of a public repo can be downloaded by anyone.
      - name: Check the report and encrypt the findings
        id: result
        if: always()
        env:
          AGE_RECIPIENT: ${{ vars.SECURITY_REPORT_AGE_RECIPIENT }}
        run: |
          grep -xE "$REPORT_LINES" report.md > public.md || echo "The test agent wrote no valid report." > public.md
          { echo 'report<<EOF'; cat public.md; echo EOF; } >> "$GITHUB_OUTPUT"
          if [ -f findings.md ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq age
            age -r "$AGE_RECIPIENT" -o findings.md.age findings.md && rm findings.md
            echo "findings=true" >> "$GITHUB_OUTPUT"
          fi
          [ "$(wc -l < public.md)" = 6 ] && ! grep -qE 'failed|FAIL' public.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.result.outputs.findings == 'true'
        with:
          name: findings
          path: findings.md.age
          retention-days: 1

  # A fresh runner: nothing the agent left behind can reach the reporting credentials. The
  # environment's reviewers approve before its secrets are released to a PR's run.
  report-findings:
    needs: test-agent
    if: always() && needs.test-agent.outputs.findings == 'true'
    runs-on: ubuntu-latest
    environment: security-report
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: findings

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.SECURITY_REPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_REPORT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Report findings privately
        env:
          AGE_IDENTITY: ${{ secrets.SECURITY_REPORT_AGE_IDENTITY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          age -d -i <(printf '%s\n' "$AGE_IDENTITY") findings.md.age \
            | jq -Rs --arg s "Test agent finding, run ${{ github.run_id }}" '{summary: $s, description: .}' \
            | gh api --method POST "repos/${{ github.repository }}/security-advisories/reports" --input - >/dev/null

  report:
    needs: test-agent
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Filtered again on this clean runner, in case the agent's runner was tampered with.
      - name: Post the public report
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.test-agent.outputs.report }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$REPORT" | grep -xE "$REPORT_LINES" > public.md || echo "The test agent wrote no valid report." > public.md
          tee -a "$GITHUB_STEP_SUMMARY" < public.md
          if [ -n "$PR_NUMBER" ]; then gh pr comment "$PR_NUMBER" -R "${{ github.repository }}" --body-file public.md; fi
