name: Publish npm

# Eén workflow voor álle npm-publishes van de CLI (stable én experiment).
# npm trusted publishing staat maar één trusted publisher (= één workflow-
# bestand) per package toe; daarom leven alle publish-jobs hier en niet in
# publish-image.yml / publish-experiment.yml. Op npmjs.com configureer je als
# trusted publisher: org infosupport, repo huddle, workflow publish-npm.yml.
# The same trusted-publisher entry is required for every platform package too.
#
# BELANGRIJK: npm matcht het OIDC-token op de ENTRY-workflow (workflow_ref),
# niet op de workflow die het `npm publish`-commando bevat (job_workflow_ref).
# Als reusable workflow (uses:) aangeroepen worden, blijft de caller de entry-
# workflow -> npm ziet dan experiment-publish.yml i.p.v. publish-npm.yml, wijst
# de trusted-publish af en valt terug op het (lege) token -> E404. Daarom wordt
# de experiment-publish via workflow_dispatch getriggerd i.p.v. workflow_call:
# zo is DÍT bestand altijd zelf de entry-workflow en klopt de identiteit.
on:
  push:
    branches: [main, release/*, experiment/**]
  workflow_dispatch:
    inputs:
      ref:
        description: Head-SHA of ref om de CLI van te bouwen.
        required: true
        type: string
      key:
        description: Experiment-nummer/-tag (bv. het PR-nummer).
        required: true
        type: string

jobs:
  # Eén job die de publicatieversie/-tag ÉÉN keer bepaalt, zodat node_platforms
  # en de CLI-job (stable/experiment/dispatch) altijd in lockstep publiceren.
  # Voorheen berekende elke job zijn eigen versie en sloeg node_platforms
  # experiment/dispatch-runs zelfs helemaal over, waardoor een gepubliceerde
  # experiment-CLI naar niet-bestaande huddle-node-* versies verwees.
  version:
    if: ${{ github.event_name == 'push' || inputs.key != '' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # GitVersion heeft de volledige historie én tags (het anker) nodig.
          fetch-depth: 0
          fetch-tags: true

      - name: Install GitVersion
        if: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'experiment/') }}
        uses: gittools/actions/gitversion/setup@51d325634925d7d9ce0a7efc2c586c0bc2b9eee6 # v3.2.1
        with:
          versionSpec: '5.x'

      - name: Determine version
        if: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'experiment/') }}
        id: gitversion
        uses: gittools/actions/gitversion/execute@51d325634925d7d9ce0a7efc2c586c0bc2b9eee6 # v3.2.1

      - name: Determine publicatieversie en dist-tag
        id: set
        env:
          BRANCH: ${{ github.ref_name }}
          KEY: ${{ inputs.key }}
          EVENT: ${{ github.event_name }}
          GV_MAJOR: ${{ steps.gitversion.outputs.major }}
          GV_MINOR: ${{ steps.gitversion.outputs.minor }}
          GV_PATCH: ${{ steps.gitversion.outputs.patch }}
          GV_COMMITS: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}
        run: |
          if [ -n "$KEY" ]; then
            # Maintainer-getriggerde experiment-publish (workflow_dispatch).
            TAG="experiment-$KEY"
            VERSION="0.0.0-${TAG}.${{ github.run_number }}.${{ github.run_attempt }}"
          elif [ "$EVENT" = "push" ] && [[ "$BRANCH" == experiment/* ]]; then
            # Push naar experiment/<issuenummer>-<omschrijving>.
            ISSUE=$(echo "$BRANCH" | sed -nE 's#^experiment/([0-9]+).*#\1#p')
            if [ -z "$ISSUE" ]; then
              echo "::error::Branchnaam '$BRANCH' bevat geen issue-nummer. Verwacht: experiment/<issuenummer>-<omschrijving>"
              exit 1
            fi
            # Leading zeros strippen zodat de tag overeenkomt met wat de CLI
            # uit het issue-nummer afleidt (experiment/007-... -> experiment-7).
            ISSUE=$((10#$ISSUE))
            TAG="experiment-$ISSUE"
            VERSION="0.0.0-${TAG}.${{ github.run_number }}.${{ github.run_attempt }}"
          else
            # Reguliere stable-push (main / release/*).
            PATCH=$((GV_PATCH + GV_COMMITS))
            VERSION="${GV_MAJOR}.${GV_MINOR}.${PATCH}"
            TAG="latest"
          fi
          echo "Publicatieversie: $VERSION (tag: $TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  node_platforms:
    # The CLI names these packages as exact optional dependencies. Publish every
    # native target first, so a newly published CLI cannot point npm at an absent
    # executable for one of its supported platforms. Runs for every trigger the
    # `version` job runs for (stable push, experiment push, and dispatch) so the
    # CLI never references a huddle-node-* version that was never published.
    needs: version
    name: Huddle Node (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
            platform: win32
            arch: x64
            package: huddle-node-win32-x64
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            package: huddle-node-darwin-x64
          - target: darwin-arm64
            runner: macos-14
            platform: darwin
            arch: arm64
            package: huddle-node-darwin-arm64
          - target: linux-x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
            package: huddle-node-linux-x64

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          # Head-SHA van de (fork-)PR bij een maintainer-getriggerde
          # experiment-dispatch (zie de `dispatch`-job) — leeg bij een gewone
          # push, dan checkt actions/checkout gewoon de triggerende ref uit.
          # Zonder dit zou deze job (die nu ook voor dispatch draait, via
          # `needs: version`) Huddle Node vanaf de default branch bouwen in
          # plaats van vanaf de ref die de CLI-job zojuist publiceerde.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Determine release version
        # De versie komt van de `version`-job hierboven, zodat deze package en
        # de CLI die er (als optionalDependency) naar verwijst altijd dezelfde
        # versie krijgen, ongeacht stable/experiment/dispatch.
        shell: pwsh
        run: |
          "VERSION=${{ needs.version.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and stage Huddle Node
        shell: pwsh
        run: |
          npm ci --prefix gateway
          npm ci --prefix gateway/frontend
          npm --prefix gateway run build:sea
          node scripts/stage-node-package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --version $env:VERSION

      - name: Publish Huddle Node package
        # dist-tag komt van de `version`-job: `latest` voor stable, of
        # experiment-<tag> zodat een experiment-run `latest` niet aanraakt.
        run: npm publish --provenance --access public --tag ${{ needs.version.outputs.tag }}
        working-directory: packages/${{ matrix.package }}

  stable:
    if: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'experiment/') }}
    needs: node_platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm verifieert een kortlevend OIDC-token van deze
      # workflow i.p.v. een opgeslagen npm-token (zie npmjs.com package settings).
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # GitVersion heeft de volledige historie én tags (het anker) nodig.
          fetch-depth: 0
          fetch-tags: true

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@51d325634925d7d9ce0a7efc2c586c0bc2b9eee6 # v3.2.1
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@51d325634925d7d9ce0a7efc2c586c0bc2b9eee6 # v3.2.1

      - uses: actions/setup-node@v4
        with:
          # Node 24 levert npm >= 11.5.1, vereist voor trusted publishing
          # (npm 10.x faalt met een misleidende 404).
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set package version
        # patch = tag-patch + aantal commits sinds de tag -> uniek en oplopend
        # per commit, onafhankelijk van de GitVersion-modus.
        run: |
          cd cli
          PATCH=$(( ${{ steps.gitversion.outputs.patch }} + ${{ steps.gitversion.outputs.commitsSinceVersionSource }} ))
          VERSION="${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}.${PATCH}"
          echo "Berekende versie: $VERSION (patch ${{ steps.gitversion.outputs.patch }} + ${{ steps.gitversion.outputs.commitsSinceVersionSource }} commits)"
          node ../scripts/set-cli-release-version.mjs "$VERSION"

      - name: Install & build
        run: cd cli && npm install && npm run build

      - name: Publish
        # Provenance vereist een publieke source-repo; auth loopt via OIDC
        # (trusted publisher), er is geen token-secret meer.
        run: cd cli && npm publish --provenance --access public

  experiment:
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'experiment/') }}
    # node_platforms moet de bijbehorende huddle-node-* versie al gepubliceerd
    # hebben voordat de CLI ernaar verwijst (anders installeren gebruikers een
    # CLI zonder werkende Huddle Node-executable, zie de Aikido-finding).
    needs: [version, node_platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm verifieert een kortlevend OIDC-token van deze
      # workflow i.p.v. een opgeslagen npm-token (zie npmjs.com package settings).
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Node 24 levert npm >= 11.5.1, vereist voor trusted publishing
          # (npm 10.x faalt met een misleidende 404).
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set experiment version
        # Versie/tag komen van de `version`-job, zodat deze exact overeenkomt
        # met de huddle-node-* versie die node_platforms zojuist publiceerde.
        run: |
          cd cli
          VERSION="${{ needs.version.outputs.version }}"
          echo "Experiment-versie: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Houd de optionalDependencies (huddle-node-*) in lockstep, anders
          # resolvet deze CLI de stable Huddle Node-package i.p.v. de
          # experiment-build (zie set-cli-release-version.mjs).
          node ../scripts/set-cli-release-version.mjs "$VERSION"

      - name: Install & build
        run: cd cli && npm install && npm run build

      - name: Publish
        # dist-tag experiment-<nr> zodat gebruikers installeren met
        # @infosupport/huddle-cli@experiment-<nr>; `latest` blijft onaangeroerd.
        run: cd cli && npm publish --provenance --access public --tag ${{ needs.version.outputs.tag }}

  # Maintainer-getriggerde experiment-publish, via workflow_dispatch getriggerd
  # door experiment-publish.yml (zie de comment bovenaan: als entry-workflow
  # klopt de OIDC-identiteit voor trusted publishing). Publiceert de CLI van een
  # willekeurige ref - inclusief een fork-PR - onder de tag experiment-<key>.
  # Identiek aan de `experiment`-job hierboven, maar de key komt uit de input
  # i.p.v. de branchnaam en de checkout gebeurt op de geresolvede head-SHA.
  dispatch:
    # Draait alleen bij een workflow_dispatch met inputs (experiment-publish.yml
    # geeft altijd een key mee); bij een push is inputs.key leeg/null -> skip,
    # dan draaien stable/experiment o.b.v. github.event_name == 'push'.
    if: ${{ inputs.key != '' }}
    # node_platforms moet de bijbehorende huddle-node-* versie al gepubliceerd
    # hebben voordat de CLI ernaar verwijst (anders installeren gebruikers een
    # CLI zonder werkende Huddle Node-executable, zie de Aikido-finding).
    needs: [version, node_platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm verifieert een kortlevend OIDC-token van deze
      # workflow i.p.v. een opgeslagen npm-token (zie npmjs.com package settings).
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Head-SHA van de (fork-)PR; staat in de object-store van de basis-repo.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          # Node 24 levert npm >= 11.5.1, vereist voor trusted publishing
          # (npm 10.x faalt met een misleidende 404).
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set experiment version
        # Versie/tag komen van de `version`-job, zodat deze exact overeenkomt
        # met de huddle-node-* versie die node_platforms zojuist publiceerde.
        run: |
          cd cli
          VERSION="${{ needs.version.outputs.version }}"
          echo "Experiment-versie: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Houd de optionalDependencies (huddle-node-*) in lockstep, anders
          # resolvet deze CLI de stable Huddle Node-package i.p.v. de
          # experiment-build (zie set-cli-release-version.mjs).
          node ../scripts/set-cli-release-version.mjs "$VERSION"

      - name: Install & build
        run: cd cli && npm install && npm run build

      - name: Publish
        # dist-tag experiment-<key> zodat gebruikers installeren met
        # @infosupport/huddle-cli@experiment-<key>; `latest` blijft onaangeroerd.
        run: cd cli && npm publish --provenance --access public --tag ${{ needs.version.outputs.tag }}
