name: Security review gate
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read # read package.json / package-lock.json at the base and head commits
  pull-requests: read
# A push, label and review on the same commit start separate runs; only the newest may set the check.
concurrency:
  group: security-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  security-review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # normally seconds; fail fast on a stuck API call instead of the 6-hour default
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.pull_request;

            // Fork PR commits are also readable from the base repo, and the fork itself may be deleted.
            const readFile = async (path, ref) => {
              try {
                const { data } = await github.rest.repos.getContent({
                  ...context.repo, path, ref, mediaType: { format: 'raw' },
                });
                return data;
              } catch (e) {
                if (e.status === 404) return null; // file added or deleted in this PR
                throw e;
              }
            };

            // The security-critical package list lives only in the last packageRule of .github/renovate.json5.
            // Read it from the base commit, so a PR cannot shrink the list it is checked against.
            const renovate = await readFile('.github/renovate.json5', pr.base.sha);
            const rule = /matchPackageNames:\s*\[([^\]]*)\][^}]*addLabels:\s*\['needs-security-review'\]/.exec(renovate ?? '');
            if (!rule) throw new Error('security-critical rule not found in .github/renovate.json5');
            const patterns = [...rule[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
            const isCritical = (name) =>
              patterns.some(p => p.endsWith('/**') ? name.startsWith(p.slice(0, -2)) : name === p);

            // Security-critical packages in one manifest or lockfile, as "<where>:<name>" -> spec or lockfile entry.
            // The whole lockfile entry counts: a swapped `resolved` URL or `integrity` at the same version is a change too.
            const criticalEntries = (path, text) => {
              const out = {};
              if (text === null) return out;
              const json = JSON.parse(text);
              if (path.endsWith('package-lock.json')) {
                for (const [key, entry] of Object.entries(json.packages ?? {})) {
                  const i = key.lastIndexOf('node_modules/');
                  if (i !== -1 && isCritical(key.slice(i + 'node_modules/'.length))) out[key] = JSON.stringify(entry);
                }
              } else {
                for (const section of ['dependencies', 'devDependencies', 'optionalDependencies', 'overrides']) {
                  for (const [name, spec] of Object.entries(json[section] ?? {})) {
                    if (isCritical(name)) out[`${section}:${name}`] = JSON.stringify(spec);
                  }
                }
              }
              return out;
            };

            // Decide from the diff, not only from the label: removing the label must not skip the review.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
            });
            // listFiles diffs against the merge base, so compare versions there too. The base branch tip
            // would attribute changes merged to main after the PR branched off to this PR.
            // per_page: 1 keeps the commit list small; only merge_base_commit is used.
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${pr.base.sha}...${pr.head.sha}`, per_page: 1,
            });
            const mergeBase = comparison.merge_base_commit.sha;
            const touched = new Set();
            for (const f of files) {
              if (!/(^|\/)(package\.json|package-lock\.json)$/.test(f.filename)) continue;
              const oldPath = f.previous_filename ?? f.filename; // renamed files: read the old path at the base
              const before = criticalEntries(oldPath, await readFile(oldPath, mergeBase));
              const after = criticalEntries(f.filename, await readFile(f.filename, pr.head.sha));
              for (const key of new Set([...Object.keys(before), ...Object.keys(after)])) {
                if (before[key] !== after[key]) touched.add(`${f.filename} ${key}`);
              }
            }
            const labelled = pr.labels.some(l => l.name === 'needs-security-review');
            if (touched.size === 0 && !labelled) {
              core.info('No security-critical package changes and no needs-security-review label: nothing to check.');
              return;
            }
            for (const t of touched) core.info(`Security-critical change: ${t}`);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
            });
            const decisive = ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'];
            const latest = new Map();
            for (const r of reviews) {
              if (r.user && decisive.includes(r.state)) latest.set(r.user.login, r);
            }
            // Only reviewers with write access to this repo count. author_association is not
            // enough: MEMBER is any org member, COLLABORATOR includes read/triage-only access.
            // The legacy `permission` field maps maintain -> write and triage -> read.
            const canWrite = async (login) => {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner, repo: context.repo.repo, username: login,
                });
                return ['admin', 'write'].includes(data.permission);
              } catch (e) {
                if (e.status === 404) return false; // not a collaborator
                throw e;
              }
            };
            const states = [];
            for (const r of latest.values()) {
              if (await canWrite(r.user.login)) states.push(r);
            }
            const approved = states.some(r => r.state === 'APPROVED' && r.commit_id === pr.head.sha);
            const blocked = states.some(r => r.state === 'CHANGES_REQUESTED');
            if (!approved || blocked) {
              core.setFailed('Security-critical change: a maintainer must approve the latest commit.');
            }
