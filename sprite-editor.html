<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprite Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0d1526; color: #e2e8f0; height: 100vh; overflow: hidden; }

/* ── Drop zone ── */
#drop-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; gap: 1rem;
}
#drop-zone.drag-over { background: #162035; }
#drop-zone h1 { font-size: 1.5rem; color: #f97316; letter-spacing: .05em; }
#drop-zone p { color: #94a3b8; font-size: .9rem; }
#open-btn {
  padding: .75rem 2rem; background: #f97316; color: #fff; border: none;
  border-radius: .5rem; cursor: pointer; font-size: 1rem; font-weight: 700;
  letter-spacing: .03em;
}
#open-btn:hover { background: #ea6c0a; }
#file-input { display: none; }
.drop-hint { font-size: .8rem; color: #475569; }

/* ── App ── */
#app { display: none; flex-direction: column; height: 100vh; }

.toolbar {
  display: flex; align-items: center; gap: .75rem; padding: .45rem 1rem;
  background: #162035; border-bottom: 1px solid #2a3a5c; flex-shrink: 0;
}
.toolbar-title { font-size: .85rem; font-weight: 700; color: #f97316; margin-right: .25rem; }
.tb-btn {
  padding: .3rem .7rem; border: 1px solid #2a3a5c; background: #1e2d4a;
  color: #e2e8f0; border-radius: .3rem; cursor: pointer; font-size: .78rem;
}
.tb-btn:hover { background: #2a3a5c; }
.tb-btn.primary { background: #f97316; border-color: #f97316; color: #fff; }
.tb-btn.primary:hover { background: #ea6c0a; }
.zoom-label { font-size: .78rem; color: #94a3b8; }
#zoom-range { width: 90px; accent-color: #f97316; }
.spacer { flex: 1; }
.tb-sep { width: 1px; height: 20px; background: #2a3a5c; }

.main { display: flex; flex: 1; overflow: hidden; }

/* ── Canvas ── */
#canvas-wrap {
  flex: 1; overflow: auto; cursor: default;
  background: repeating-conic-gradient(#1a2845 0% 25%, #162035 0% 50%) 0 0 / 24px 24px;
  padding: 24px;
}
#sprite-container { position: relative; display: inline-block; }
#sprite-img { display: block; image-rendering: pixelated; }

/* ── Overlay boxes ── */
.box {
  position: absolute; border: 2px solid; cursor: move; user-select: none;
  transition: opacity .1s;
}
.box:hover { z-index: 100; }
.box.selected { z-index: 200; }

.box-fill {
  position: absolute; inset: 0; opacity: .12;
}
.box-label {
  position: absolute; bottom: calc(100% + 2px); left: -2px;
  font-size: 10px; font-weight: 700; white-space: nowrap;
  padding: 2px 6px; border-radius: 3px; color: #fff; letter-spacing: .03em;
  pointer-events: none;
}

.handle {
  position: absolute; width: 9px; height: 9px;
  background: #fff; border: 2px solid rgba(0,0,0,.5);
  border-radius: 2px; z-index: 10;
}
.h-tl { top:-5px; left:-5px; cursor:nw-resize; }
.h-tr { top:-5px; right:-5px; cursor:ne-resize; }
.h-bl { bottom:-5px; left:-5px; cursor:sw-resize; }
.h-br { bottom:-5px; right:-5px; cursor:se-resize; }
.h-t  { top:-5px; left:calc(50% - 4px); cursor:n-resize; }
.h-b  { bottom:-5px; left:calc(50% - 4px); cursor:s-resize; }
.h-l  { left:-5px; top:calc(50% - 4px); cursor:w-resize; }
.h-r  { right:-5px; top:calc(50% - 4px); cursor:e-resize; }

/* ── Panel ── */
.panel {
  width: 290px; flex-shrink: 0; background: #162035;
  border-left: 1px solid #2a3a5c; display: flex; flex-direction: column;
}
.panel-tabs {
  display: flex; border-bottom: 1px solid #2a3a5c; flex-shrink: 0;
}
.ptab {
  flex: 1; padding: .55rem .5rem; text-align: center; font-size: .78rem;
  font-weight: 600; cursor: pointer; color: #94a3b8;
  background: transparent; border: none; border-bottom: 2px solid transparent;
}
.ptab.on { color: #f97316; border-bottom-color: #f97316; }

.panel-body { flex: 1; overflow-y: auto; padding: .75rem; }

.sprite-card {
  border: 1px solid #2a3a5c; border-radius: .4rem;
  margin-bottom: .6rem; overflow: hidden;
}
.sprite-card.selected { border-color: #f97316; }
.card-head {
  display: flex; align-items: center; gap: .5rem;
  padding: .4rem .6rem; cursor: pointer; font-size: .78rem; font-weight: 700;
  background: #0d1526;
}
.card-head:hover { background: #1a2845; }
.cdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.card-head-id { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-toggle { color: #94a3b8; font-size: .7rem; }

.card-body { padding: .5rem .6rem; background: #0d1526; border-top: 1px solid #2a3a5c; }
.field-grid { display: grid; grid-template-columns: 16px 1fr 16px 1fr; gap: .25rem .4rem; align-items: center; }
.fl { font-size: .7rem; color: #94a3b8; text-align: right; }
.fi {
  background: #1e2d4a; border: 1px solid #2a3a5c; color: #e2e8f0;
  padding: .2rem .35rem; border-radius: .25rem; font-size: .75rem; width: 100%;
}
.fi:focus { outline: none; border-color: #f97316; }

.display-row { margin-top: .5rem; padding-top: .4rem; border-top: 1px solid #2a3a5c; }
.display-row label { font-size: .7rem; color: #64748b; display: block; margin-bottom: .3rem; }
.display-row select {
  width: 100%; background: #1e2d4a; border: 1px solid #2a3a5c; color: #e2e8f0;
  padding: .2rem .35rem; border-radius: .25rem; font-size: .74rem; margin-bottom: .25rem;
}
.display-row select:focus { outline: none; border-color: #f97316; }

/* ── CSS tab ── */
.css-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: .5rem;
}
.css-header span { font-size: .75rem; font-weight: 700; color: #94a3b8; }
.css-block {
  background: #0d1526; border: 1px solid #2a3a5c; border-radius: .35rem;
  padding: .6rem; font-size: .68rem; font-family: monospace; line-height: 1.6;
  white-space: pre; overflow-x: auto; color: #94a3b8; margin-bottom: .5rem;
}
.t-sel { color: #f97316; }
.t-prop { color: #7dd3fc; }
.t-val { color: #86efac; }
.t-cmt { color: #475569; }

.copy-css-btn {
  width: 100%; padding: .4rem; background: #1e2d4a; border: 1px solid #2a3a5c;
  color: #e2e8f0; border-radius: .3rem; cursor: pointer; font-size: .78rem;
  font-weight: 600; margin-bottom: 1rem;
}
.copy-css-btn:hover { background: #2a3a5c; }
.copy-css-btn.ok { background: #166534; border-color: #22c55e; color: #86efac; }
</style>
</head>
<body>

<div id="drop-zone">
  <h1>SPRITE EDITOR</h1>
  <p>Load <code>sprite.light.png</code> or <code>sprite.dark.png</code></p>
  <button id="open-btn">Open sprite image</button>
  <input type="file" id="file-input" accept="image/*">
  <span class="drop-hint">or drag &amp; drop an image here</span>
</div>

<div id="app">
  <div class="toolbar">
    <span class="toolbar-title">SPRITE EDITOR</span>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="load-btn">Load image</button>
    <span class="zoom-label">Zoom</span>
    <input type="range" id="zoom-range" min="15" max="150" value="45">
    <span class="zoom-label" id="zoom-val">45%</span>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="addRegion()">+ Add region</button>
    <div class="spacer"></div>
    <button class="tb-btn primary" onclick="copyCss()">Copy CSS</button>
    <button class="tb-btn" onclick="exportJson()">Export JSON</button>
  </div>
  <div class="main">
    <div id="canvas-wrap">
      <div id="sprite-container">
        <img id="sprite-img" draggable="false">
      </div>
    </div>
    <div class="panel">
      <div class="panel-tabs">
        <button class="ptab on" id="tab-regions" onclick="showTab('regions')">Regions</button>
        <button class="ptab" id="tab-css" onclick="showTab('css')">CSS</button>
      </div>
      <div class="panel-body" id="pane-regions"></div>
      <div class="panel-body" id="pane-css" style="display:none"></div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────

let imgW = 836, imgH = 1807, scale = 0.45;

// Display config: how each sprite is displayed in the actual UI
// mode: 'responsive' | 'fixed-h' | 'fixed-w' | 'cover' | 'fixed'
const COLORS = ['#f97316','#3b82f6','#22c55e','#a855f7','#ef4444','#f59e0b','#06b6d4','#ec4899'];

let regions = [
  { id:'sidebar-penguin-illustration', x:0,   y:0,    w:836, h:331, color:COLORS[0], mode:'responsive', dw:220, dh:0  },
  { id:'hero-penguins-icebergs',       x:0,   y:331,  w:836, h:471, color:COLORS[1], mode:'fixed-h',    dw:0,   dh:160 },
  { id:'footer-penguins-right',        x:0,   y:802,  w:836, h:470, color:COLORS[2], mode:'fixed-h',    dw:0,   dh:180 },
  { id:'huddle-logo-icon',             x:0,   y:1272, w:376, h:350, color:COLORS[3], mode:'cover',      dw:40,  dh:40  },
  { id:'footer-penguins-left',         x:0,   y:1622, w:250, h:123, color:COLORS[4], mode:'fixed',      dw:250, dh:123 },
  { id:'user-avatar',                  x:0,   y:1745, w:62,  h:62,  color:COLORS[5], mode:'fixed',      dw:62,  dh:62  },
];

let selectedIdx = -1;
let drag = null; // { idx, handle:'move'|tl|tr|bl|br|t|b|l|r, mx, my, ox, oy, ow, oh }

// ─────────────────────────────────────────────────────────────────────────────
// File loading
// ─────────────────────────────────────────────────────────────────────────────

function loadImageFile(file) {
  const url = URL.createObjectURL(file);
  const img = document.getElementById('sprite-img');
  img.onload = () => {
    imgW = img.naturalWidth;
    imgH = img.naturalHeight;
    document.getElementById('drop-zone').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    applyZoom();
    renderAll();
  };
  img.src = url;
}

document.getElementById('open-btn').onclick =
document.getElementById('load-btn').onclick = () => document.getElementById('file-input').click();

document.getElementById('file-input').onchange = (e) => {
  if (e.target.files[0]) loadImageFile(e.target.files[0]);
};

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', (e) => {
  e.preventDefault(); dz.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]);
});

// ─────────────────────────────────────────────────────────────────────────────
// Zoom
// ─────────────────────────────────────────────────────────────────────────────

document.getElementById('zoom-range').oninput = (e) => {
  scale = parseInt(e.target.value) / 100;
  document.getElementById('zoom-val').textContent = e.target.value + '%';
  applyZoom();
  renderBoxes();
};

function applyZoom() {
  const img = document.getElementById('sprite-img');
  img.style.width  = Math.round(imgW * scale) + 'px';
  img.style.height = Math.round(imgH * scale) + 'px';
}

// ─────────────────────────────────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────────────────────────────────

function renderAll() {
  renderBoxes();
  renderPanel();
  if (document.getElementById('tab-css').classList.contains('on')) renderCss();
}

function renderBoxes() {
  const container = document.getElementById('sprite-container');
  container.querySelectorAll('.box').forEach(el => el.remove());

  regions.forEach((r, idx) => {
    const box = document.createElement('div');
    box.className = 'box' + (idx === selectedIdx ? ' selected' : '');
    box.dataset.idx = idx;
    box.style.cssText = [
      `left:${Math.round(r.x * scale)}px`,
      `top:${Math.round(r.y * scale)}px`,
      `width:${Math.round(r.w * scale)}px`,
      `height:${Math.round(r.h * scale)}px`,
      `border-color:${r.color}`,
    ].join(';');

    const fill = document.createElement('div');
    fill.className = 'box-fill';
    fill.style.background = r.color;
    box.appendChild(fill);

    const lbl = document.createElement('div');
    lbl.className = 'box-label';
    lbl.style.background = r.color;
    lbl.textContent = r.id;
    box.appendChild(lbl);

    ['tl','tr','bl','br','t','b','l','r'].forEach(h => {
      const el = document.createElement('div');
      el.className = `handle h-${h}`;
      el.dataset.handle = h;
      box.appendChild(el);
    });

    container.appendChild(box);
  });
}

function renderPanel() {
  const pane = document.getElementById('pane-regions');
  pane.innerHTML = '';
  regions.forEach((r, idx) => {
    const card = document.createElement('div');
    card.className = 'sprite-card' + (idx === selectedIdx ? ' selected' : '');
    card.id = `card-${idx}`;

    const open = idx === selectedIdx;
    card.innerHTML = `
      <div class="card-head" onclick="selectRegion(${idx})">
        <div class="cdot" style="background:${r.color}"></div>
        <span class="card-head-id">${r.id}</span>
        <span class="card-toggle">${open ? '▲' : '▼'}</span>
      </div>
      ${open ? `
      <div class="card-body">
        <div class="field-grid">
          <span class="fl">x</span><input class="fi" type="number" value="${r.x}" onchange="updateField(${idx},'x',this.value)">
          <span class="fl">y</span><input class="fi" type="number" value="${r.y}" onchange="updateField(${idx},'y',this.value)">
          <span class="fl">w</span><input class="fi" type="number" value="${r.w}" onchange="updateField(${idx},'w',this.value)">
          <span class="fl">h</span><input class="fi" type="number" value="${r.h}" onchange="updateField(${idx},'h',this.value)">
        </div>
        <div class="display-row">
          <label>Display mode (for CSS generation)</label>
          <select onchange="updateField(${idx},'mode',this.value)">
            ${['responsive','fixed-h','fixed-w','cover','fixed'].map(m =>
              `<option value="${m}"${r.mode===m?' selected':''}>${m}</option>`).join('')}
          </select>
          <div class="field-grid">
            <span class="fl">dw</span><input class="fi" type="number" value="${r.dw}" onchange="updateField(${idx},'dw',this.value)" placeholder="display W">
            <span class="fl">dh</span><input class="fi" type="number" value="${r.dh}" onchange="updateField(${idx},'dh',this.value)" placeholder="display H">
          </div>
        </div>
      </div>` : ''}
    `;
    pane.appendChild(card);
  });
}

function renderCss() {
  const pane = document.getElementById('pane-css');
  pane.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'css-header';
  header.innerHTML = '<span>style.css — sprite section</span>';
  pane.appendChild(header);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-css-btn';
  copyBtn.textContent = 'Copy all CSS';
  copyBtn.onclick = copyCss;
  pane.appendChild(copyBtn);

  regions.forEach(r => {
    const block = document.createElement('div');
    block.className = 'css-block';
    block.innerHTML = formatCss(r);
    pane.appendChild(block);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// CSS generation
// ─────────────────────────────────────────────────────────────────────────────

function computeCssValues(r) {
  const { x, y, w, h, mode, dw, dh } = r;
  let bgSizeW, xOff, yOff, dispW, dispH;

  if (mode === 'responsive') {
    // Scale sprite so that asset width = 100% of element
    // background-size: (imgW/w * 100)% auto
    // For y-offset: at element width W, offset = y/w * W
    // Expressed as % of element: -y/w * 100 % — but CSS % pos != pixel offset
    // Use a fixed reference width for the output
    const refW = dw || 220;
    const sc = refW / w;
    bgSizeW = Math.round(imgW * sc);
    xOff = Math.round(x * sc);
    yOff = Math.round(y * sc);
    dispW = refW;
    dispH = Math.round(h * sc);
    return { bgSizeW, xOff, yOff, dispW, dispH, isResponsive: true, aspectW: w, aspectH: h };
  }

  if (mode === 'fixed-h') {
    const sc = dh / h;
    bgSizeW = Math.round(imgW * sc);
    dispW   = Math.round(w * sc);
    dispH   = dh;
    xOff    = Math.round(x * sc);
    yOff    = Math.round(y * sc);
    return { bgSizeW, xOff, yOff, dispW, dispH };
  }

  if (mode === 'fixed-w') {
    const sc = dw / w;
    bgSizeW = Math.round(imgW * sc);
    dispW   = dw;
    dispH   = Math.round(h * sc);
    xOff    = Math.round(x * sc);
    yOff    = Math.round(y * sc);
    return { bgSizeW, xOff, yOff, dispW, dispH };
  }

  if (mode === 'cover') {
    const sc = Math.max(dw / w, dh / h);
    bgSizeW = Math.round(imgW * sc);
    const sw = Math.round(w * sc);
    const sh = Math.round(h * sc);
    xOff    = Math.round(x * sc + (sw - dw) / 2);
    yOff    = Math.round(y * sc + (sh - dh) / 2);
    dispW   = dw; dispH = dh;
    return { bgSizeW, xOff, yOff, dispW, dispH };
  }

  // fixed: display at given dw×dh, scale proportionally by width
  const sc = dw / w;
  bgSizeW = Math.round(imgW * sc);
  xOff    = Math.round(x * sc);
  yOff    = Math.round(y * sc);
  dispW   = dw; dispH = dh || Math.round(h * sc);
  return { bgSizeW, xOff, yOff, dispW, dispH };
}

function fv(n) { return n === 0 ? '0' : `-${n}px`; }

function hl(cls, txt) { return `<span class="${cls}">${txt}</span>`; }

function formatCss(r) {
  const v = computeCssValues(r);
  const S = hl('t-sel', `.sprite-${r.id}`);
  const lines = [];

  if (v.isResponsive) {
    lines.push(`${S} {`);
    lines.push(`  ${hl('t-prop','width')}: ${hl('t-val','100%')};`);
    lines.push(`  ${hl('t-prop','aspect-ratio')}: ${hl('t-val',`${v.aspectW} / ${v.aspectH}`)};`);
    lines.push(`  ${hl('t-prop','background-size')}: ${hl('t-val', v.bgSizeW+'px')} ${hl('t-val','auto')};`);
    lines.push(`  ${hl('t-prop','background-position')}: ${hl('t-val', fv(v.xOff))} ${hl('t-val', fv(v.yOff))};`);
    lines.push(`  ${hl('t-cmt',`/* ref width: ${v.dispW}px — recalc if sidebar width changes */`)}`);
    lines.push('}');
  } else {
    lines.push(`${S} {`);
    lines.push(`  ${hl('t-prop','width')}: ${hl('t-val',v.dispW+'px')}; ${hl('t-prop','height')}: ${hl('t-val',v.dispH+'px')};`);
    lines.push(`  ${hl('t-prop','background-size')}: ${hl('t-val', v.bgSizeW+'px')} ${hl('t-val','auto')};`);
    lines.push(`  ${hl('t-prop','background-position')}: ${hl('t-val', fv(v.xOff))} ${hl('t-val', fv(v.yOff))};`);
    lines.push('}');
  }
  return lines.join('\n');
}

function allCssText() {
  const hdr = [
    ':root { --sprite-url: url(\'/assets/sprite.light.png\'); }',
    '[data-theme="dark"] { --sprite-url: url(\'/assets/sprite.dark.png\'); }',
    '',
    '.sprite {',
    '  background-image: var(--sprite-url);',
    '  background-repeat: no-repeat;',
    '  display: block;',
    '}',
    '',
  ].join('\n');

  return hdr + regions.map(r => {
    const v = computeCssValues(r);
    if (v.isResponsive) {
      return [
        `.sprite-${r.id} {`,
        `  width: 100%;`,
        `  aspect-ratio: ${v.aspectW} / ${v.aspectH};`,
        `  background-size: ${v.bgSizeW}px auto;`,
        `  background-position: ${fv(v.xOff)} ${fv(v.yOff)};`,
        `  /* ref width: ${v.dispW}px */`,
        '}',
      ].join('\n');
    }
    return [
      `.sprite-${r.id} {`,
      `  width: ${v.dispW}px; height: ${v.dispH}px;`,
      `  background-size: ${v.bgSizeW}px auto;`,
      `  background-position: ${fv(v.xOff)} ${fv(v.yOff)};`,
      '}',
    ].join('\n');
  }).join('\n\n');
}

// ─────────────────────────────────────────────────────────────────────────────
// Interaction
// ─────────────────────────────────────────────────────────────────────────────

function selectRegion(idx) {
  selectedIdx = (selectedIdx === idx) ? -1 : idx;
  renderBoxes();
  renderPanel();
  if (document.getElementById('tab-css').classList.contains('on')) renderCss();
  if (selectedIdx >= 0) {
    const card = document.getElementById(`card-${selectedIdx}`);
    if (card) card.scrollIntoView({ block: 'nearest' });
  }
}

function updateField(idx, key, val) {
  const r = regions[idx];
  r[key] = ['x','y','w','h','dw','dh'].includes(key) ? parseInt(val)||0 : val;
  renderBoxes();
  if (document.getElementById('tab-css').classList.contains('on')) renderCss();
}

function addRegion() {
  const idx = regions.length;
  regions.push({
    id: `region-${idx}`,
    x: 0, y: 0, w: 100, h: 100,
    color: COLORS[idx % COLORS.length],
    mode: 'fixed', dw: 100, dh: 100,
  });
  selectedIdx = idx;
  renderAll();
  setTimeout(() => {
    const card = document.getElementById(`card-${idx}`);
    if (card) card.scrollIntoView({ block: 'nearest' });
  }, 50);
}

function showTab(tab) {
  document.getElementById('tab-regions').classList.toggle('on', tab === 'regions');
  document.getElementById('tab-css').classList.toggle('on', tab === 'css');
  document.getElementById('pane-regions').style.display = tab === 'regions' ? '' : 'none';
  document.getElementById('pane-css').style.display = tab === 'css' ? '' : 'none';
  if (tab === 'css') renderCss();
}

async function copyCss() {
  const text = allCssText();
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.querySelector('.copy-css-btn') || document.querySelector('.tb-btn.primary');
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('ok'); }, 1500);
    }
  } catch { alert(text); }
}

function exportJson() {
  const data = { spriteW: imgW, spriteH: imgH, regions };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sprite-regions.json';
  a.click();
}

// ─────────────────────────────────────────────────────────────────────────────
// Drag & resize mouse handling
// ─────────────────────────────────────────────────────────────────────────────

document.getElementById('sprite-container').addEventListener('mousedown', (e) => {
  const boxEl = e.target.closest('.box');
  if (!boxEl) return;
  e.preventDefault();

  const idx = parseInt(boxEl.dataset.idx);
  const r   = regions[idx];
  const handle = e.target.dataset.handle || 'move';

  drag = { idx, handle, mx: e.clientX, my: e.clientY, ox: r.x, oy: r.y, ow: r.w, oh: r.h };
  if (selectedIdx !== idx) {
    selectedIdx = idx;
    renderPanel();
    document.querySelectorAll('.box').forEach((b, i) => {
      b.classList.toggle('selected', parseInt(b.dataset.idx) === idx);
    });
    document.querySelectorAll('.sprite-card').forEach((c, i) => {
      c.classList.toggle('selected', i === idx);
    });
  }
});

document.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const dx = Math.round((e.clientX - drag.mx) / scale);
  const dy = Math.round((e.clientY - drag.my) / scale);
  const r  = regions[drag.idx];
  const MIN = 8;

  if (drag.handle === 'move') {
    r.x = drag.ox + dx;
    r.y = drag.oy + dy;
  } else {
    const h = drag.handle;
    if (h.includes('r')) { r.w = Math.max(MIN, drag.ow + dx); }
    if (h.includes('b')) { r.h = Math.max(MIN, drag.oh + dy); }
    if (h.includes('l')) {
      const nw = Math.max(MIN, drag.ow - dx);
      r.x = drag.ox + (drag.ow - nw);
      r.w = nw;
    }
    if (h.includes('t')) {
      const nh = Math.max(MIN, drag.oh - dy);
      r.y = drag.oy + (drag.oh - nh);
      r.h = nh;
    }
  }

  // Update box position (fast path — no full re-render)
  const boxEl = document.querySelector(`.box[data-idx="${drag.idx}"]`);
  if (boxEl) {
    boxEl.style.left   = Math.round(r.x * scale) + 'px';
    boxEl.style.top    = Math.round(r.y * scale) + 'px';
    boxEl.style.width  = Math.round(r.w * scale) + 'px';
    boxEl.style.height = Math.round(r.h * scale) + 'px';
  }

  // Update inputs live
  const card = document.getElementById(`card-${drag.idx}`);
  if (card) {
    const inputs = card.querySelectorAll('.fi');
    if (inputs.length >= 4) {
      inputs[0].value = r.x;
      inputs[1].value = r.y;
      inputs[2].value = r.w;
      inputs[3].value = r.h;
    }
  }
});

document.addEventListener('mouseup', () => {
  if (!drag) return;
  drag = null;
  if (document.getElementById('tab-css').classList.contains('on')) renderCss();
});

// Keyboard: delete selected, arrow nudge
document.addEventListener('keydown', (e) => {
  if (selectedIdx < 0) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

  const r = regions[selectedIdx];
  const step = e.shiftKey ? 10 : 1;

  if (e.key === 'ArrowLeft')  { r.x -= step; e.preventDefault(); }
  if (e.key === 'ArrowRight') { r.x += step; e.preventDefault(); }
  if (e.key === 'ArrowUp')    { r.y -= step; e.preventDefault(); }
  if (e.key === 'ArrowDown')  { r.y += step; e.preventDefault(); }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (confirm(`Delete region "${r.id}"?`)) {
      regions.splice(selectedIdx, 1);
      selectedIdx = -1;
      renderAll();
      return;
    }
  }

  // Fast update
  const boxEl = document.querySelector(`.box[data-idx="${selectedIdx}"]`);
  if (boxEl) {
    boxEl.style.left = Math.round(r.x * scale) + 'px';
    boxEl.style.top  = Math.round(r.y * scale) + 'px';
  }
  const card = document.getElementById(`card-${selectedIdx}`);
  if (card) {
    const inputs = card.querySelectorAll('.fi');
    if (inputs[0]) inputs[0].value = r.x;
    if (inputs[1]) inputs[1].value = r.y;
  }
  if (document.getElementById('tab-css').classList.contains('on')) renderCss();
});
</script>
